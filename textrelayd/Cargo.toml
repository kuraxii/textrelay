[package]
name = "textrelayd"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
libc = "0.2"
bluer = { version = "0.17", features = ["bluetoothd"] }
uuid = { version = "1.27.0", features = ["v4"] }
futures = "0.3.34"
